<!doctype html>
<html lang="es" data-theme="claro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Enlaces directos para la tipografía Inter de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>TP2 ~ Equipo 11</title>

    <!-- Inicializa el tema antes de renderizar React. -->
    <script>
      (() => {
        try {
          const temaGuardado = localStorage.getItem("theme");
          const prefiereOscuro = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;

          const tema =
            temaGuardado === "claro" || temaGuardado === "oscuro"
              ? temaGuardado
              : prefiereOscuro
                ? "oscuro"
                : "claro";

          document.documentElement.setAttribute("data-theme", tema);
        } catch {
          document.documentElement.setAttribute("data-theme", "claro");
        }
      })();
    </script>
    <style>
      html {
        background-color: #fff;
        color-scheme: light;
      }

      html[data-theme="oscuro"] {
        background-color: #111827;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
